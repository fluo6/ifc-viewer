server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell document must not retain an old MIME type or asset manifest
    # after a container update. Vite's hashed JS/WASM assets remain cacheable.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
